<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff3742;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e55039;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Heart shape -->
  <path d="M16 26c-1 0-8-4.5-8-10.5 0-3.5 2.5-6 6-6 1.5 0 2.8 0.6 3.8 1.6C18.8 10.1 20.1 9.5 21.6 9.5c3.5 0 6 2.5 6 6C27.6 21.5 17 26 16 26z" 
        fill="url(#heartGradient)" 
        filter="url(#shadow)"
        stroke="#d63031" 
        stroke-width="0.5"/>
  
  <!-- Heart highlight -->
  <ellipse cx="14" cy="13" rx="2" ry="1.5" fill="#ff6b7a" opacity="0.6"/>
</svg>