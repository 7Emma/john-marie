<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbcfe8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#db2777;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be185d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond carré avec coin arrondi -->
  <rect width="100" height="100" rx="20" fill="url(#bgGradient)"/>
  
  <!-- Cœur -->
  <path d="M50 85 C20 65 10 50 10 38 C10 25 18 15 28 15 C35 15 42 20 50 28 C58 20 65 15 72 15 C82 15 90 25 90 38 C90 50 80 65 50 85 Z" 
        fill="url(#heartGradient)" 
        style="filter: drop-shadow(0 2px 4px rgba(236, 72, 153, 0.3))"/>
  
  <!-- Petits éléments décoratifs (points or) -->
  <circle cx="25" cy="20" r="2" fill="#ca8a04" opacity="0.6"/>
  <circle cx="75" cy="20" r="2" fill="#ca8a04" opacity="0.6"/>
  <circle cx="15" cy="50" r="1.5" fill="#ca8a04" opacity="0.4"/>
  <circle cx="85" cy="50" r="1.5" fill="#ca8a04" opacity="0.4"/>
</svg>
